# viewer can GET applicationsets (so every read view works) but NOT create them,
# which is the exact permission the Preview tab requires (POST .../generate).
#
# Apply with: kubectl patch cm argocd-rbac-cm -n argocd --patch-file rbac/argocd-rbac-cm-patch.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
data:
  policy.csv: |
    p, role:appset-viewer, applicationsets, get, */*, allow
    p, role:appset-viewer, applications, get, */*, allow
    p, role:appset-viewer, projects, get, *, allow
    g, viewer, role:appset-viewer
  policy.default: ""
