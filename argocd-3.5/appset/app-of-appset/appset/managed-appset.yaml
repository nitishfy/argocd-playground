# BEAT 6 - app-of-ApplicationSets preview.
# This ApplicationSet is a RESOURCE of the parent Application below, not applied directly.
# Edit this file in Git (without syncing the parent) to make the parent OutOfSync,
# which is the precondition for the per-Application preview panel to render a diff.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: managed-regions
  namespace: argocd
  labels:
    demo: appset-ui
    owner: platform
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - region: us-east
          - region: eu-west
  template:
    metadata:
      name: 'region-{{.region}}'
    spec:
      project: platform
      source:
        repoURL: REPO_URL
        targetRevision: HEAD
        path: DEMO_PATH/workloads/dev
      destination:
        server: https://kubernetes.default.svc
        namespace: 'region-{{.region}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions: [CreateNamespace=true]
