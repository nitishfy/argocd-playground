apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    env: qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        env: qa
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
