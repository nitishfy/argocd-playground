# BEATS 2, 3 - resource tree, owner badge, live generator re-evaluation.
# Git directory generator over workloads/*. Adding workloads/qa/ makes a 4th app appear.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: envs
  namespace: argocd
  labels:
    demo: appset-ui
    owner: platform
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: REPO_URL
        revision: HEAD
        directories:
          - path: DEMO_PATH/workloads/*
  template:
    metadata:
      name: 'env-{{.path.basename}}'
      labels:
        env: '{{.path.basename}}'
    spec:
      project: platform
      source:
        repoURL: REPO_URL
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'env-{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions: [CreateNamespace=true]
