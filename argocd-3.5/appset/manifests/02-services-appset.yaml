# BEAT 4 - the Preview tab.
# Deliberately a LIST generator: the docs note that Git/SCM/PR/Cluster generators are
# re-evaluated on every Preview click, so they can be slow or flaky on camera.
# A list generator makes the diff instant and deterministic.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
  labels:
    demo: appset-ui
    owner: team-a
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: api
            replicas: "1"
          - name: worker
            replicas: "1"
          - name: cache
            replicas: "1"
  template:
    metadata:
      name: 'svc-{{.name}}'
      labels:
        service: '{{.name}}'
    spec:
      project: team-a
      source:
        repoURL: REPO_URL
        targetRevision: HEAD
        path: DEMO_PATH/workloads/dev
      destination:
        server: https://kubernetes.default.svc
        namespace: 'svc-{{.name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions: [CreateNamespace=true]
