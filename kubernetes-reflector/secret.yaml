# This lives in ns1 (Argo CD instance #1's namespace).
# It's a normal Argo CD repo-credential secret, just like the ones
# argocd-repo-server reads directly today.
apiVersion: v1
kind: Secret
metadata:
  name: repo-creds
  namespace: ns1
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    # Reflector-specific annotations — these are what do the work.
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "ns3"
type: Opaque
stringData:
  type: git
  url: https://github.com/argoproj/argocd-example-apps
  username: demo-user
  password: demo-password-v1
